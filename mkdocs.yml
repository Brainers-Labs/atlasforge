site_name: AtlasForge
site_description: Run, evaluate, compare and fine-tune the official N-ATLaS models (Hausa, Yoruba, Igbo, Nigerian English).
repo_url: https://github.com/im-aderm/atlasforge
repo_name: im-aderm/atlasforge
edit_uri: edit/main/docs/
docs_dir: docs
strict: true

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - macros:
      module_name: docs_macros
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            heading_level: 3
            members_order: source
            docstring_section_style: list
            merge_init_into_class: true
            show_signature_annotations: true
            separate_signature: true

nav:
  - Home: index.md
  - Get started:
      - get-started/index.md
      - Quickstart (no model needed): get-started/quickstart.md
      - Installation: get-started/installation.md
      - Access and licences: get-started/access-and-licences.md
      - Choose your setup: get-started/choose-your-setup.md
  - Concepts:
      - concepts/index.md
      - How it works: concepts/how-it-works.md
      - Tone-aware scoring: concepts/tone-aware-scoring.md
      - Statistics: concepts/statistics.md
      - Datasets: concepts/datasets.md
      - Run directories: concepts/run-directories.md
  - Guides:
      - guides/index.md
      - Evaluate a model: guides/evaluate-a-model.md
      - Compare two models: guides/compare-two-models.md
      - Validate your data: guides/validate-your-data.md
      - Transcribe speech: guides/transcribe-speech.md
      - Serve N-ATLaS: guides/serve-n-atlas.md
      - Fine-tune with QLoRA: guides/fine-tune-with-qlora.md
      - Publish a model card: guides/publish-a-model-card.md
  - Reference:
      - reference/index.md
      - CLI: reference/cli.md
      - Python API: reference/python-api.md
      - Metrics: reference/metrics.md
      - Fine-tune settings: reference/fine-tune-settings.md
      - File formats: reference/file-formats.md
      - Errors and exit codes: reference/errors.md
      - Environment variables: reference/environment.md
  - Help:
      - Troubleshooting: help/troubleshooting.md
      - FAQ: help/faq.md
      - Project status: help/status.md
      - Glossary: help/glossary.md
  - Project:
      - Contributing: project/contributing.md
      - Changelog: project/changelog.md
