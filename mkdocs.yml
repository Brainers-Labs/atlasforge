site_name: AtlasForge
site_description: Run, evaluate, compare and fine-tune the official N-ATLaS models (Hausa, Yoruba, Igbo, Nigerian English).
repo_url: https://github.com/im-aderm/atlasforge
repo_name: im-aderm/atlasforge
edit_uri: edit/main/docs/
docs_dir: docs
strict: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_root_heading: true
            show_source: false
            heading_level: 3
            members_order: source
            docstring_style: google
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
      - Models and access: getting-started/models-and-access.md
  - Concepts:
      - How AtlasForge works: concepts/how-it-works.md
      - Tone-aware scoring: concepts/tone-aware-scoring.md
      - Honest statistics: concepts/honest-statistics.md
  - Guides:
      - Evaluate a model: guides/evaluate.md
      - Compare two models: guides/compare.md
      - Validate a dataset: guides/validate-dataset.md
      - Transcribe and evaluate speech: guides/asr.md
      - Serve the models: guides/serve-models.md
      - Run locally with transformers: guides/local-backend.md
      - Run on a Mac (Apple Silicon): guides/mac.md
      - Fine-tuning: guides/fine-tuning.md
      - Use the Python API: guides/python-api.md
  - Reference:
      - CLI: reference/cli.md
      - Dataset format: reference/dataset-format.md
      - Metrics: reference/metrics.md
      - Normalisation: reference/normalization.md
      - Output files: reference/output-files.md
      - Configuration: reference/configuration.md
      - Errors and exit codes: reference/errors.md
      - Python API: reference/python-api.md
  - N-ATLaS:
      - Verified model facts: natlas/model-facts.md
      - Licence and compliance: natlas/licence.md
  - Operations:
      - Troubleshooting: operations/troubleshooting.md
      - Security and privacy: operations/security-privacy.md
      - FAQ: operations/faq.md
  - Project:
      - Status and roadmap: project/status.md
      - Contributing: project/contributing.md
      - Development: project/development.md
      - Changelog: project/changelog.md
