name: Feature request
description: Suggest a capability AtlasForge should have.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        AtlasForge only supports official `NCAIR1/*` models. Requests to wrap another
        foundation model, ship a playground/gateway, or call N-ATLaS a different name
        are out of scope by design.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that AtlasForge makes hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: The shape of the change, if you have one in mind. CLI flag, Python API, report output?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Evaluation / metrics / normalisation
        - Compare / statistics
        - Dataset validation
        - Speech (ASR)
        - Fine-tuning
        - Model cards
        - CLI / Python API
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have tried
      description: Existing flags, workarounds, or other tools.
    validations:
      required: false
