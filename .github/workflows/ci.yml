name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest --cov --cov-report=term-missing

  package:
    name: build sdist + wheel and install them clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - name: install the built wheel into a fresh venv and run it
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/atlasforge --version
          /tmp/clean/bin/python -c "import atlasforge, sys; assert 'torch' not in sys.modules"
      - name: install the built sdist into a fresh venv and run it
        run: |
          python -m venv /tmp/clean-sdist
          /tmp/clean-sdist/bin/pip install dist/*.tar.gz
          /tmp/clean-sdist/bin/atlasforge --help > /dev/null

  light-core:
    name: core install stays light
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - name: core install must not pull heavy ML packages
        run: |
          python - <<'PY'
          import importlib.util, sys
          heavy = [m for m in ("torch", "transformers", "librosa") if importlib.util.find_spec(m)]
          assert not heavy, f"heavy packages in core install: {heavy}"
          import atlasforge.cli  # noqa: F401
          assert "torch" not in sys.modules
          PY
      - run: atlasforge --version

  docs:
    name: docs build (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[docs]"
      # Strict: a broken link, a missing page or an undocumented metric/setting fails the build.
      - run: mkdocs build --strict
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site

  security:
    name: secrets + dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: pip-audit
      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: gitleaks --all-files
