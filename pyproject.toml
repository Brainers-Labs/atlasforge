[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
# The distribution name is org-scoped because the plain name is taken: PyPI's `atlasforge`
# is an unrelated bioinformatics project (gene-family atlases, first released 21 Aug 2026).
# `pip install atlasforge` would install that one. The import name stays `atlasforge`, and so
# does the `atlasforge` command — the same split as Pillow/PIL.
name = "brainers-atlasforge"
dynamic = ["version"]
description = "Run, evaluate, compare and fine-tune the official N-ATLaS models (Hausa, Yoruba, Igbo, Nigerian English)."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Brainers Labs" }]
keywords = ["n-atlas", "nigeria", "hausa", "yoruba", "igbo", "llm", "asr", "evaluation", "fine-tuning"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
# The core install must stay light: no torch, no transformers. Heavy stacks live in extras.
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",     # OpenAI-compatible backend
  "numpy>=1.26",     # vectorised bootstrap
  "jiwer>=3.0",      # WER / CER
  "sacrebleu>=2.4",  # chrF / chrF++
  "tomli>=2.0; python_version < '3.11'",  # stdlib tomllib arrives in 3.11
]

[project.optional-dependencies]
local = [
  "torch>=2.2",
  "transformers>=4.44",
  "accelerate>=0.33",
  "safetensors>=0.4",
  "huggingface-hub>=0.24",
  "bitsandbytes>=0.43; sys_platform != 'darwin'",
]
asr = [
  "torch>=2.2",
  "transformers>=4.44",
  "huggingface-hub>=0.24",
  "librosa>=0.10",
  "soundfile>=0.12",
]
finetune = [
  "brainers-atlasforge[local]",
  "peft>=0.12",
  "trl>=0.9",
  "datasets>=2.20",
  "pyyaml>=6.0",
]
# `atlasforge bench afrobench` shells out to lm-evaluation-harness. Its `hf` extra is what
# brings torch/transformers, but the components are named here so the versions match the
# `local` extra instead of whatever the harness pins on the day it is installed.
bench = [
  "lm-eval>=0.4",
  "torch>=2.2",
  "transformers>=4.44",
  "accelerate>=0.33",
]
docs = [
  "mkdocs>=1.6,<2",  # 2.0 removes the plugin system
  "mkdocs-material>=9.5",
  "mkdocs-macros-plugin>=1.0",
  "mkdocstrings[python]>=0.26",
]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "tomli>=2.0",         # for mypy, which does not know about version markers
  "ruff>=0.9",
  "mypy>=1.11",
  "pip-audit>=2.7",
  "pre-commit>=3.8",
  "pyyaml>=6.0",        # reads YAML fine-tune configs in tests
  "types-PyYAML>=6.0",
  "brainers-atlasforge[docs]",
]

[project.scripts]
atlasforge = "atlasforge.cli:main"

[project.urls]
Homepage = "https://github.com/im-aderm/atlasforge"
Issues = "https://github.com/im-aderm/atlasforge/issues"

[tool.hatch.version]
path = "src/atlasforge/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/atlasforge"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

# ---------------------------------------------------------------- tooling

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
# Design docs contain illustrative snippets, not code we ship.
extend-exclude = ["planning"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "PT", "RUF",
  "S", "PERF", "PL", "TC", "ANN", "ARG", "RET", "PIE", "T20", "ISC",
]
ignore = [
  "E501",    # line length is owned by the formatter
  "PLR2004", # magic values in comparisons are fine when obvious
  "PLR0913", # keyword-only config-style signatures are intentional
  "ANN401",  # Any is occasionally the honest type
]

[tool.ruff.lint.per-file-ignores]
# Typer builds the CLI from function parameters, so commands legitimately take many options.
"src/atlasforge/cli.py" = ["PLR0917"]
# A script's whole job is to report to a terminal, and it is not part of the shipped package.
"scripts/**" = ["T20"]
# A notebook's cells exist to show their output. `display` is IPython's public name for the
# function that renders one, so shadowing it is the API, not an accident.
"notebooks/**" = ["T20", "A004"]
# This module exists to be the cheap top level of the package: every AtlasForge import
# inside it is deferred into the function that needs it, on purpose.
"src/atlasforge/api.py" = ["PLC0415"]
# The docs macros register many small functions and deliberately contain look-alike quote characters.
"docs_macros.py" = ["PLR0915", "RUF001"]
# Tests deliberately contain non-ASCII look-alike characters (curly quotes, U+2028) and fake secrets.
"tests/**" = ["S101", "S105", "S603", "S404", "ANN", "PLR2004", "ARG", "T20", "RUF001"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
# No python_version pin: check against the interpreter running mypy (CI covers 3.10 and 3.13).
# Third-party stubs such as numpy's use newer syntax than our 3.10 floor.
strict = true
warn_unreachable = true
# `scripts/` is not shipped, but it is the code that produces the submission evidence, so it is
# held to the same standard as the package rather than left as an unchecked corner.
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "live: needs GPU, gated weights and HF_TOKEN; run with ATLASFORGE_LIVE=1",
]

[tool.coverage.run]
branch = true
source = ["atlasforge"]

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "\\.\\.\\."]
# A floor, not a target: the suite runs at ~99%. This stops a silent regression
# (the ffmpeg-gated tests skip on Windows, so the floor is not 99).
fail_under = 90
